<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이어온</title>
<link rel="icon" href="/favicon.ico">
<style>
/* 대화 중심 화면(설계 UI_CHAT_FIRST U1). 서버 데이터는 모두 textContent로 넣는다(HTML 문자열로 넣지 않음). */
:root {
  --bg:#f3f5f7; --surface:#fff; --surface-alt:#f7f9fb; --text:#1f2329; --muted:#5b6573; --border:#dfe3e8;
  --accent:#0f766e; --accent-soft:#e6f4f2; --on-accent:#fff; --warn:#7a4f00; --warn-soft:#fdf3dc; --err:#a12b37; --err-soft:#fbe9eb; --ok:#17654d;
  --shadow:0 12px 40px rgba(20,30,40,.14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f1214; --surface:#171b1e; --surface-alt:#1d2226; --text:#e8ecef; --muted:#9aa6b1; --border:#2a3136;
  --accent:#2bb3a5; --accent-soft:#16312e; --on-accent:#06201d; --warn:#f0c46a; --warn-soft:#33290f; --err:#f08a96; --err-soft:#3a1d22; --ok:#5fd0a8; --shadow:0 12px 40px rgba(0,0,0,.5);
} }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:15px/1.55 "Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif; }
button, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
a { color:var(--accent); }
.muted { color:var(--muted); } .small { font-size:13px; }
.logo { width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700; font-size:17px; flex:none; }

.app { flex:1; min-height:0; display:grid; grid-template-columns:280px 1fr auto; }
.side { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
.side-top { display:flex; align-items:center; gap:10px; padding:16px; }
.side-top .name { font-weight:700; } .side-top .where { font-size:12px; color:var(--muted); }
.addbtn { margin:0 12px 8px; border:1px dashed var(--border); background:none; border-radius:12px; padding:10px; color:var(--accent); font-weight:600; text-align:center; text-decoration:none; display:block; }
.list { overflow:auto; flex:1; padding:0 8px 8px; }
.row { width:100%; text-align:left; border:0; background:none; border-radius:12px; padding:10px; display:grid; grid-template-columns:36px 1fr; gap:10px; align-items:center; }
.row:hover { background:var(--surface-alt); }
.row[aria-current="true"] { background:var(--accent-soft); }
.av { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-weight:700; color:#fff; font-size:13px; }
.av.codex_thread { background:#3b4a63; } .av.claude_channel, .av.claude_cli { background:#b86a45; }
.row .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .s { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .s.warn { color:var(--warn); } .row .s.err { color:var(--err); }
.empty { padding:16px; color:var(--muted); font-size:14px; }
details.arch { margin:8px 4px 0; } details.arch summary { cursor:pointer; color:var(--muted); font-size:13px; padding:6px; }
.arow { display:flex; gap:8px; align-items:center; padding:6px; font-size:14px; } .arow span { flex:1; }
.side-bottom { border-top:1px solid var(--border); padding:8px; display:flex; flex-direction:column; gap:2px; }
.side-bottom a, .side-bottom button { border:0; background:none; text-align:left; padding:9px 10px; border-radius:10px; display:flex; gap:10px; align-items:center; color:inherit; text-decoration:none; }
.side-bottom a:hover, .side-bottom button:hover { background:var(--surface-alt); }

.chat { display:flex; flex-direction:column; min-width:0; min-height:0; }
.head { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
.head h2 { margin:0; font-size:17px; }
.chip { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--surface-alt); border:1px solid var(--border); color:var(--muted); }
.spacer { flex:1; }
.switch { display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:4px 10px 4px 4px; font-size:13px; }
.switch .knob { width:34px; height:20px; border-radius:99px; background:var(--border); position:relative; flex:none; }
.switch .knob::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:99px; background:#fff; transition:left .15s; }
.switch[aria-checked="true"] .knob { background:var(--accent); } .switch[aria-checked="true"] .knob::after { left:16px; }
.iconbtn { border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:6px 10px; font-size:13px; }
.back { display:none; }
.msgs { flex:1; overflow:auto; padding:20px 18px; display:flex; flex-direction:column; gap:12px; }
.bubble { max-width:min(680px,88%); padding:10px 14px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
.me { align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; }
.ai { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.ai.wait { color:var(--muted); }
.steps { align-self:flex-start; display:flex; gap:6px; flex-wrap:wrap; font-size:12px; }
.steps span { padding:2px 8px; border-radius:99px; background:var(--surface-alt); border:1px solid var(--border); color:var(--muted); }
.steps span.done { color:var(--ok); border-color:currentColor; }
.notice { align-self:stretch; border:1px solid currentColor; border-radius:12px; padding:10px 14px; font-size:14px; }
.notice.warn { color:var(--warn); background:var(--warn-soft); } .notice.err { color:var(--err); background:var(--err-soft); }
.notice .acts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.notice .acts button { border:1px solid currentColor; background:var(--surface); color:inherit; border-radius:10px; padding:5px 12px; font-size:13px; }
.welcome { margin:auto; text-align:center; color:var(--muted); max-width:420px; padding:24px; }
.compose { display:flex; gap:8px; padding:12px 18px 18px; align-items:flex-end; }
.compose textarea { flex:1; resize:none; max-height:180px; border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:12px 14px; line-height:1.5; }
.compose button { border:0; background:var(--accent); color:var(--on-accent); border-radius:12px; padding:12px 18px; font-weight:600; }
.compose button:disabled, .compose textarea:disabled { opacity:.55; cursor:not-allowed; }

.panel { width:320px; background:var(--surface); border-left:1px solid var(--border); overflow:auto; padding:16px 18px; }
.panel h3 { font-size:15px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
.ghost { border:0; background:none; color:var(--muted); padding:4px; }
.kv { display:grid; grid-template-columns:90px 1fr; gap:8px 10px; font-size:14px; margin:0; }
.kv dt { color:var(--muted); } .kv dd { margin:0; overflow-wrap:anywhere; }
.sec { border-top:1px solid var(--border); margin-top:16px; padding-top:14px; font-size:14px; }
.sec h4 { margin:0 0 8px; font-size:14px; }
details.adv summary { cursor:pointer; color:var(--muted); }
details.adv[open] summary { margin-bottom:10px; }
.radio { display:flex; gap:8px; align-items:flex-start; margin:6px 0; font-size:14px; }
.pbtn { border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:6px 12px; font-size:13px; margin:6px 6px 0 0; }
.pbtn.danger { color:var(--err); }

.toast { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:30; max-width:min(560px,calc(100% - 32px)); padding:10px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:14px; background:var(--surface); border:1px solid var(--border); }
.toast.ok { color:var(--ok); } .toast.warn { color:var(--warn); background:var(--warn-soft); } .toast.err { color:var(--err); background:var(--err-soft); }

.login { flex:1; display:grid; place-items:center; padding:16px; }
.card { width:min(420px,100%); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px; box-shadow:var(--shadow); }
.card h1 { font-size:21px; margin:14px 0 6px; }
.card input { width:100%; border:1px solid var(--border); background:var(--surface-alt); border-radius:10px; padding:10px 12px; margin-top:10px; }
.card .primary { width:100%; border:0; border-radius:12px; padding:12px; background:var(--accent); color:var(--on-accent); font-weight:600; margin-top:16px; }

@media (max-width: 760px) {
  .app { grid-template-columns:1fr; }
  .app:not(.in-chat) .chat, .app:not(.in-chat) .panel { display:none; }
  .app.in-chat .side { display:none; }
  .back { display:inline-block; }
  .panel { position:fixed; inset:0 0 0 auto; width:min(340px,100%); z-index:20; box-shadow:var(--shadow); }
  .compose textarea { font-size:16px; }
  .bubble { max-width:92%; }
}
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 로그인·관리자 만들기(허브). 이 PC에서 연 화면은 자동 로그인 -->
<section class="login" id="login" hidden>
  <form class="card" id="loginForm">
    <div class="logo" aria-hidden="true">이</div>
    <h1 id="loginTitle">로그인</h1>
    <p class="muted small" id="loginHint"></p>
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" required>
    <input id="pw2" type="password" placeholder="비밀번호 다시" aria-label="비밀번호 다시" autocomplete="new-password" hidden>
    <button class="primary" id="loginBtn">로그인</button>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="연결한 대화">
    <div class="side-top"><div class="logo" aria-hidden="true">이</div><div><div class="name">이어온</div><div class="where" id="where"></div></div></div>
    <a class="addbtn" href="/classic#sessions" title="지금은 예전 화면의 세션 등록에서 연결합니다">＋ 대화 연결</a>
    <div class="list" id="list"></div>
    <div class="side-bottom">
      <a href="/classic#bots"><span aria-hidden="true">✈</span>메신저</a>
      <a href="/classic" id="settingsLink"><span aria-hidden="true">⚙</span>설정</a>
      <button type="button" id="logoutBtn" hidden><span aria-hidden="true">⎋</span>로그아웃</button>
    </div>
  </aside>

  <main class="chat" aria-label="대화">
    <div class="head">
      <button type="button" class="iconbtn back" id="backBtn" aria-label="대화 목록으로">←</button>
      <h2 id="title">대화를 고르세요</h2>
      <span class="chip" id="engineChip" hidden></span>
      <span class="chip" id="stateChip" hidden></span>
      <span class="spacer"></span>
      <button type="button" class="switch" role="switch" aria-checked="false" id="liveSwitch" hidden><span class="knob"></span><span id="liveLabel">AI 응답 꺼짐</span></button>
      <button type="button" class="iconbtn" id="panelBtn" aria-expanded="false" hidden>연결 설정</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"><div class="welcome" id="welcome">왼쪽에서 대화를 고르면 이어서 질문할 수 있어요.</div></div>
    <form class="compose" id="compose">
      <textarea id="question" rows="1" placeholder="메시지" aria-label="메시지" disabled></textarea>
      <button id="send" disabled>보내기</button>
    </form>
  </main>

  <aside class="panel" id="panel" aria-label="연결 설정" hidden>
    <h3>연결 설정 <button type="button" class="ghost" id="panelClose" aria-label="닫기">✕</button></h3>
    <dl class="kv">
      <dt>엔진</dt><dd id="pEngine"></dd>
      <dt>잇는 방법</dt><dd id="pHow"></dd>
      <dt>상태</dt><dd id="pState"></dd>
    </dl>
    <div class="sec" id="pNew" hidden>
      <h4>새 세션</h4>
      <div id="pNewInfo" class="small"></div>
      <button type="button" class="pbtn" id="nsSleep">잠재우기</button>
      <button type="button" class="pbtn danger" id="nsDelete">삭제</button>
    </div>
    <div class="sec">
      <details class="adv" id="pAdv"><summary>고급</summary>
        <div id="pMode" hidden>
          <div class="small muted">Codex 연결 방식</div>
          <label class="radio"><input type="radio" name="mode" value="alternate"> <span>번갈아 쓰기 <span class="muted small">(기본 · 보낼 때 Codex 앱에서 이 대화를 닫아 두기)</span></span></label>
          <label class="radio"><input type="radio" name="mode" value="shared_server"> <span>동시 사용 <span class="muted small">(공유 서버와 TUI)</span></span></label>
        </div>
        <dl class="kv small" style="margin-top:10px"><dt>대화 ID</dt><dd id="pId" class="small"></dd></dl>
      </details>
    </div>
  </aside>
</div>

<script>
const ENGINE = { codex_thread: 'Codex', claude_channel: 'Claude 채널', claude_cli: 'Claude 새 세션' };
const AV = { codex_thread: 'Cx', claude_channel: 'Cl', claude_cli: 'Cl' };
const HOW = { codex_thread: '보낼 때마다 같은 대화를 다시 열어 이어 씀', claude_channel: '실행 중인 세션에 직접 전달', claude_cli: '질문마다 같은 세션을 이어서 실행' };
const MODE = { alternate: '번갈아 쓰기', shared_server: '동시 사용' };
const NS_STATE = { pending: '첫 질문 전', active: '깨어 있음', sleeping: '잠듦', archived: '보관됨' };
const ERR = {
  conversation_busy: ['warn', '이 대화에서 처리 중인 질문이 있어 보낼 수 없어요.'],
  device_unavailable: ['err', 'PC 연결이 끊겨 보낼 수 없어요. PC가 켜져 있는지 확인하세요.'],
  desktop_holds_thread: ['warn', 'Codex 앱에서 이 대화를 열고 있어 보내지 않았어요. 앱에서 닫은 뒤 다시 보내세요.'],
  thread_busy: ['warn', '공유 서버에서 이 대화가 사용 중이라 보내지 않았어요.'],
  thread_not_open: ['warn', '공유 서버에 이 대화가 열려 있지 않아요.'],
  shared_server_down: ['err', '공유 App Server가 실행 중이 아니에요.'],
  session_not_running: ['err', 'Claude 세션이 실행 중이 아니에요. 채널과 함께 세션을 다시 시작하세요.'],
  live_disabled: ['warn', 'AI 응답이 꺼져 있어요. 위쪽 스위치를 켜세요.'],
  thread_not_allowed: ['err', '허용되지 않은 대화예요.'],
  shared_server_not_configured: ['err', '공유 App Server 설정이 없어요.'],
  session_archived: ['warn', '보관된 세션이에요. 왼쪽 보관함에서 꺼낸 뒤 질문하세요.'],
  active_limit: ['warn', '새 세션 질문을 동시에 처리할 수 있는 수를 넘었어요. 잠시 후 다시 보내세요.'],
  session_forked: ['warn', '같은 Claude 세션을 터미널에서 열고 있어 결과를 확인할 수 없어요. 자동으로 다시 보내지 않아요.'],
  profile_not_allowed: ['err', '이 권한은 화면에서 고를 수 없어요.'],
  new_sessions_not_configured: ['err', '새 세션 설정이 없어요.'],
};
const NS_ERR = { not_active: '깨어 있는 세션이 아니에요', conversation_busy: '처리 중이거나 확인 필요 질문이 있어요', confirm_mismatch: '이름 확인이 맞지 않아요' };
const AUTH_ERR = { bad_password: '비밀번호가 맞지 않아요', weak_password: '비밀번호는 10자 이상으로 정하세요', locked: '여러 번 틀려 잠시 잠겼어요. 잠시 뒤 다시 하세요',
  already_setup: '관리자가 이미 있어요. 로그인하세요', setup_required: '관리자를 먼저 만드세요', bad_origin: '이 화면에서 다시 시도하세요' };

const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
let authState = null, convs = [], current = null, pending = null, device = null, toastTimer = null;

function toast(kind, text) {
  clearTimeout(toastTimer);
  const t = $('toast'); t.hidden = !text; if (!text) return;
  t.className = 'toast ' + kind; t.textContent = text;
  if (kind !== 'err') toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}
const api = async (path, init = {}) => {
  const res = await fetch(path, { ...init, credentials: 'same-origin', headers: { 'content-type': 'application/json', ...(init.headers || {}) } });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  return { status: res.status, body: res.status === 204 ? null : await res.json().catch(() => ({})) };
};
const authPost = (path, body) => fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
  .then(async (r) => ({ status: r.status, body: await r.json().catch(() => ({})) }));

// --- 로그인 ---
function showLogin() {
  const setup = authState?.setupRequired;
  $('app').hidden = true; $('login').hidden = false;
  $('loginTitle').textContent = setup ? '관리자 만들기' : '로그인';
  $('loginHint').textContent = setup ? '처음 한 번 관리자 비밀번호(10자 이상)를 정해요. 다음부터 이 비밀번호로 들어와요.' : '';
  $('pw2').hidden = !setup; $('pw2').required = Boolean(setup);
  $('loginBtn').textContent = setup ? '만들기' : '로그인';
  $('pw').autocomplete = setup ? 'new-password' : 'current-password';
}
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const setup = authState?.setupRequired;
  if (setup && $('pw').value !== $('pw2').value) return toast('err', '두 비밀번호가 달라요');
  const r = await authPost(setup ? '/v1/auth/setup' : '/v1/auth/login', { password: $('pw').value });
  if (r.status !== 200) return toast('err', AUTH_ERR[r.body.error] || r.body.error || '로그인하지 못했어요');
  $('pw').value = ''; $('pw2').value = ''; toast('', '');
  authState = { ...authState, setupRequired: false, loggedIn: true }; startApp();
};
$('logoutBtn').onclick = async () => { await authPost('/v1/auth/logout'); location.reload(); };

// --- 시작 ---
async function boot() {
  authState = await fetch('/v1/auth/state', { credentials: 'same-origin' }).then((r) => r.json()).catch(() => null);
  const hub = authState?.mode === 'hub';
  document.title = '이어온 — ' + (hub ? '허브' : '이 PC');
  $('where').textContent = hub ? '허브 · ' + location.host : '이 PC';
  $('settingsLink').href = hub ? '/classic#bots' : '/classic#pc';
  $('logoutBtn').hidden = !hub;
  if (authState?.loggedIn) return startApp();
  if (authState?.localAuto && (await authPost('/v1/auth/local')).status === 200) return startApp();
  showLogin();
}
async function startApp() {
  $('login').hidden = true; $('app').hidden = false;
  await Promise.all([load(), loadDevice()]).catch(() => {});
}

// --- AI 응답 스위치(이 PC 화면에서만. 허브·휴대폰에서는 서버가 404로 답해 숨긴다) ---
async function loadDevice() {
  const r = await api('/v1/admin/local/device').catch(() => ({ status: 0 }));
  device = r.status === 200 ? r.body : null;
  $('liveSwitch').hidden = !device;
  if (device) { $('liveSwitch').setAttribute('aria-checked', String(device.live)); $('liveLabel').textContent = device.live ? 'AI 응답 켜짐' : 'AI 응답 꺼짐'; }
}
$('liveSwitch').onclick = async () => {
  const on = !device?.live;
  if (on && !confirm('AI 응답을 켜면 질문마다 Codex·Claude가 호출돼요. 켤까요?')) return;
  const r = await api('/v1/admin/local/device/live', { method: 'PUT', body: JSON.stringify({ live: on }) });
  toast(r.status === 200 ? 'ok' : 'err', r.status === 200 ? 'AI 응답을 ' + (on ? '켰어요' : '껐어요') : (r.body.error === 'local_only' ? '이 PC에서 연 화면에서만 바꿀 수 있어요' : '바꾸지 못했어요: ' + r.body.error));
  loadDevice();
};

// --- 대화 목록 ---
function stateOf(c) {
  if (!c.deviceOnline) return ['err', 'PC 연결 끊김'];
  if (c.engineReady === false) return ['err', c.engine === 'claude_channel' ? 'Claude 세션 꺼짐' : '공유 서버 꺼짐'];
  if (c.heldBy) return ['warn', '확인 필요'];
  if (c.busy) return ['warn', '처리 중'];
  if (c.newSession && c.newSession.state === 'sleeping') return ['', '잠듦 · 질문하면 깨어나요'];
  return ['', '보낼 수 있음'];
}
async function load() {
  const { body } = await api('/v1/conversations');
  convs = body.conversations;
  const list = $('list'); list.replaceChildren();
  const live = convs.filter((c) => c.newSession?.state !== 'archived');
  const arch = convs.filter((c) => c.newSession?.state === 'archived');
  if (!live.length) list.append(el('div', '연결한 대화가 없어요. 위의 "대화 연결"로 시작하세요.', 'empty'));
  for (const c of live) {
    const b = el('button', null, 'row'); b.type = 'button'; b.setAttribute('aria-current', String(current === c.conversationId));
    const av = el('div', AV[c.engine] || '?', 'av ' + c.engine); av.setAttribute('aria-hidden', 'true');
    const box = el('div'); box.style.minWidth = '0';
    const [k, s] = stateOf(c);
    box.append(el('div', c.label, 't'), el('div', (ENGINE[c.engine] || c.engine) + ' · ' + s, 's' + (k ? ' ' + k : '')));
    b.append(av, box); b.onclick = () => select(c.conversationId); list.append(b);
  }
  if (arch.length) {
    const d = el('details', null, 'arch'); d.append(el('summary', '보관함 ' + arch.length));
    for (const c of arch) {
      const r = el('div', null, 'arow'); const btn = el('button', '꺼내기', 'pbtn'); btn.type = 'button';
      btn.onclick = async () => { const x = await api('/v1/sessions/' + c.conversationId + '/restore', { method: 'POST' });
        toast(x.status === 200 ? 'ok' : 'err', x.status === 200 ? '"' + c.label + '"을 보관함에서 꺼냈어요' : '꺼낼 수 없어요: ' + x.body.error); load(); };
      r.append(el('span', c.label), btn); d.append(r);
    }
    list.append(d);
  }
  if (current && !convs.some((c) => c.conversationId === current)) { current = null; showEmpty(); }
  else if (current) renderHead();
}
function showEmpty() {
  $('title').textContent = '대화를 고르세요'; $('engineChip').hidden = true; $('stateChip').hidden = true; $('panelBtn').hidden = true; setPanel(false);
  $('msgs').replaceChildren(el('div', '왼쪽에서 대화를 고르면 이어서 질문할 수 있어요.', 'welcome'));
  $('question').disabled = true; $('send').disabled = true; $('app').classList.remove('in-chat');
}

// --- 대화 ---
const conv = () => convs.find((x) => x.conversationId === current);
async function select(id) {
  current = id; $('app').classList.add('in-chat');
  await load();
  const { body } = await api('/v1/conversations/' + id + '/messages');
  const box = $('msgs'); box.replaceChildren();
  if (!body.messages.length) box.append(el('div', '아직 이어온에서 주고받은 메시지가 없어요. 아래에 질문을 쓰면 같은 대화에서 이어서 답해요.', 'welcome'));
  for (const m of body.messages) { box.append(el('div', m.question, 'bubble me')); box.append(el('div', m.answer ?? '(보관하지 않은 답변)', 'bubble ai')); }
  renderHead(); box.scrollTop = box.scrollHeight;
}
function addNotice(kind, text, actions) {
  const n = el('div', null, 'notice ' + kind); n.setAttribute('role', 'status'); n.append(el('div', text));
  if (actions?.length) { const a = el('div', null, 'acts'); for (const [label, fn] of actions) { const b = el('button', label); b.type = 'button'; b.onclick = () => fn(n); a.append(b); } n.append(a); }
  $('msgs').append(n); $('msgs').scrollTop = $('msgs').scrollHeight; return n;
}
let shownNotice = null;
function renderHead() {
  const c = conv(); if (!c) return;
  $('title').textContent = c.label;
  $('engineChip').hidden = false; $('engineChip').textContent = ENGINE[c.engine] || c.engine;
  const [k, s] = stateOf(c);
  $('stateChip').hidden = false; $('stateChip').textContent = s;
  $('panelBtn').hidden = false;
  const can = c.deviceOnline && c.engineReady !== false && !c.busy && !pending;
  $('question').disabled = !can; $('send').disabled = !can;
  $('question').placeholder = c.label + '에게 메시지';
  renderPanel(c);
  // 보낼 수 없는 이유는 대화 안에 안내로 보인다(같은 이유는 한 번만).
  const key = c.conversationId + ':' + (pending ? 'pending' : k + s + (c.heldBy?.requestId || ''));
  if (shownNotice === key) return;
  shownNotice = key;
  document.querySelectorAll('#msgs .notice.state').forEach((n) => n.remove());
  if (pending) return;
  let n = null;
  if (!c.deviceOnline) n = addNotice('err', ERR.device_unavailable[1]);
  else if (c.engineReady === false) n = addNotice('err', ERR[c.engine === 'claude_channel' ? 'session_not_running' : 'shared_server_down'][1]);
  else if (c.heldBy) {
    const text = c.heldBy.status === 'approval_required' ? '원래 세션에서 권한 확인이 필요해 멈춘 질문이 있어요. 자동으로 승인하지 않아요.'
      : c.heldBy.errorCode === 'turn_joined_by_other_input' ? '처리 중에 TUI 입력이 합류해 결과를 확정하지 못한 질문이 있어요. 자동으로 다시 보내지 않아요.'
        : '결과를 확인하지 못한 질문이 있어요. 원래 앱에서 실행됐는지 확인한 뒤 정리하세요. 자동으로 다시 보내지 않아요.';
    n = addNotice('warn', text, [['실행됐어요', () => review(true)], ['실행되지 않았어요', () => review(false)]]);
  } else if (c.busy) n = addNotice('warn', ERR.conversation_busy[1]);
  if (n) n.classList.add('state');
}
async function review(executed) {
  const c = conv(); if (!c?.heldBy) return;
  const r = await api('/v1/requests/' + c.heldBy.requestId + '/review', { method: 'POST', body: JSON.stringify({ executed }) });
  if (r.status !== 200) return toast('err', '정리할 수 없어요: ' + r.body.error);
  toast('ok', executed ? '실행된 것으로 정리했어요. 받지 못한 답은 저장하지 않았어요' : '실행되지 않은 것으로 정리했어요. 필요하면 직접 다시 보내세요');
  shownNotice = null; load();
}
const qa = $('question');
qa.addEventListener('input', () => { qa.style.height = 'auto'; qa.style.height = Math.min(qa.scrollHeight, 180) + 'px'; });
qa.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('compose').requestSubmit(); } });
$('compose').onsubmit = async (e) => {
  e.preventDefault();
  const question = qa.value.trim(); if (!question || !current || pending) return;
  const id = current;
  const { status, body } = await api('/v1/conversations/' + id + '/requests', { method: 'POST', headers: { 'idempotency-key': crypto.randomUUID() }, body: JSON.stringify({ question }) });
  if (status !== 202) { const [k, t] = ERR[body.error] || ['err', '보낼 수 없어요: ' + body.error]; addNotice(k, t); return; }
  qa.value = ''; qa.style.height = 'auto';
  pending = body.requestId;
  document.querySelectorAll('#msgs .welcome').forEach((w) => w.remove());
  $('msgs').append(el('div', question, 'bubble me'));
  const steps = el('div', null, 'steps'); const s1 = el('span', '✓ 접수', 'done'); const s2 = el('span', '실행 중…'); steps.append(s1, s2);
  const out = el('div', '답을 기다리는 중…', 'bubble ai wait');
  $('msgs').append(steps, out); $('msgs').scrollTop = $('msgs').scrollHeight;
  renderHead();
  try {
    while (true) {
      await new Promise((r) => setTimeout(r, 2000));
      const r = (await api('/v1/requests/' + pending)).body;
      if (r.status === 'completed') { s2.textContent = '✓ 완료'; s2.className = 'done'; out.textContent = r.answer ?? '(보관하지 않은 답변)'; out.classList.remove('wait'); break; }
      if (r.status === 'failed') { out.remove(); s2.textContent = '보내지 못함'; const [k, t] = ERR[r.errorCode] || ['err', '실행하지 못했어요: ' + r.errorCode]; addNotice(k, t); break; }
      if (r.status === 'unknown') { out.remove(); s2.textContent = '확인 필요'; break; }
      if (r.status === 'approval_required') { out.remove(); s2.textContent = '권한 확인 대기'; break; }
    }
  } finally { pending = null; shownNotice = null; if (current === id) await load(); }
};

// --- 연결 설정 패널 ---
function setPanel(open) { $('panel').hidden = !open; $('panelBtn').setAttribute('aria-expanded', String(open)); }
$('panelBtn').onclick = () => setPanel($('panel').hidden);
$('panelClose').onclick = () => setPanel(false);
$('backBtn').onclick = () => { $('app').classList.remove('in-chat'); setPanel(false); };
function renderPanel(c) {
  $('pEngine').textContent = ENGINE[c.engine] || c.engine;
  $('pHow').textContent = HOW[c.engine] || '';
  $('pState').textContent = stateOf(c)[1];
  $('pId').textContent = c.conversationId;
  $('pMode').hidden = c.engine !== 'codex_thread';
  for (const r of document.getElementsByName('mode')) { r.checked = r.value === (c.connectMode || 'alternate'); r.disabled = c.busy || Boolean(pending); }
  $('pNew').hidden = !c.newSession;
  if (c.newSession) {
    $('pNewInfo').textContent = (NS_STATE[c.newSession.state] || c.newSession.state) + ' · 권한 ' + c.newSession.profile + (c.newSession.sessionId ? ' · 직접 열기 ID ' + c.newSession.sessionId : '');
    $('nsSleep').disabled = c.newSession.state !== 'active' || c.busy;
  }
}
for (const r of document.getElementsByName('mode')) {
  r.onchange = async () => {
    const x = await api('/v1/conversations/' + current + '/settings', { method: 'PUT', body: JSON.stringify({ connectMode: r.value }) });
    if (x.status !== 200) { const [k, t] = ERR[x.body.error] || ['err', '바꾸지 못했어요: ' + x.body.error]; toast(k, t); }
    else toast('ok', (MODE[r.value] || r.value) + '로 바꿨어요');
    load();
  };
}
$('nsSleep').onclick = async () => {
  const r = await api('/v1/sessions/' + current + '/sleep', { method: 'POST' });
  toast(r.status === 200 ? 'ok' : 'err', r.status === 200 ? '잠재웠어요. 질문하면 다시 깨어나요' : (NS_ERR[r.body.error] || r.body.error)); load();
};
$('nsDelete').onclick = async () => {
  const c = conv(); if (!c?.newSession) return;
  const typed = prompt('삭제하면 이어온 기록이 지워지고 되돌릴 수 없어요(원래 Codex·Claude 기록은 남아요). 지우려면 세션 이름 "' + c.newSession.name + '"을 입력하세요.');
  if (typed === null) return;
  const r = await api('/v1/sessions/' + current, { method: 'DELETE', body: JSON.stringify({ confirm: typed.trim() }) });
  toast(r.status === 200 ? 'ok' : 'err', r.status === 200 ? '"' + c.newSession.name + '"을 삭제했어요' : (NS_ERR[r.body.error] || r.body.error)); load();
};

boot();
setInterval(() => { if (!$('app').hidden && !pending) load().catch(() => {}); }, 5000);
setInterval(() => { if (!$('app').hidden) loadDevice().catch(() => {}); }, 30000);
</script>
</body>
</html>
