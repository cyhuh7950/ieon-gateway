# 이어온 허브(ieun-gateway.sinsan.kr). 위치: ubuntu@sinsan-server:~/deploy/ieon-gateway (저장소 전체가 이 폴더, 데이터는 hub/data).
# NPM 프록시 호스트 ieun-gateway.sinsan.kr → http://ieun-relay:28770 이 이 컨테이너를 가리킨다. 호스트 포트는 열지 않는다.
# 데이터(DB·설정·내부 토큰·Codex 로그인)는 hub/data에만 있다. 사용: cd ~/deploy/ieon-gateway && docker compose -f deploy/hub/compose.yaml up -d --build
name: ieun-hub
services:
  hub:
    build: { context: ../.., dockerfile: deploy/hub/Dockerfile }
    image: ieun-hub:0.0.1
    container_name: ieun-relay
    restart: unless-stopped
    user: "1001:1001"   # ubuntu(UID·GID 1001): hub/data의 주인과 같다
    volumes:
      - ../../hub/data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    networks: [proxy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:28760/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy-network:
    external: true
