# SV1 엔진 칸 하나(SERVER_SESSIONS 2-8 결정 A — 칸 자체가 경계). 직접 쓰지 말고 deploy/hub/ieun.sh engine add <이름> 으로 만든다.
# 허브와 같은 이미지(ieun-hub)에서 이어온 서버(허브 연결 모드)+연결부만 돌린다. 메신저·공개 포트 없음.
# 칸마다 자기 데이터 폴더(engines/<이름>/data: 엔진 로그인·대화 이력·작업 폴더·이어온 설정)만 연결한다.
# 네트워크는 이 칸만의 기본 네트워크 — 허브·같은 서버의 다른 서비스(DB 등)와 붙지 않고 바깥(허브 공개 주소·OpenAI·Anthropic)으로만 나간다.
name: ieun-engine-${ENGINE_NAME:?ENGINE_NAME}
services:
  engine:
    image: ieun-hub:0.0.1
    container_name: ieun-engine-${ENGINE_NAME}
    restart: unless-stopped
    user: "1001:1001"
    command: ["node", "src/engine/run.mjs", "/data"]
    environment:
      HOME: /data/home
      CODEX_HOME: /data/codex
      IEON_HUB_URL: ${IEON_HUB_URL:-https://ieun-gateway.sinsan.kr}
      IEON_ENGINE_NAME: ${ENGINE_LABEL:-서버}
      IEON_CONTAINER_BOUNDARY: "1"   # 작업 모드는 컨테이너가 경계(엔진 샌드박스 대신) — 명령·파일 수정은 여전히 승인 카드로 묻는다
    volumes:
      - ../../engines/${ENGINE_NAME}/data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ENGINE_MEM:-1g}
    pids_limit: ${ENGINE_PIDS:-256}
