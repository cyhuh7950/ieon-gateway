# SV4 서버 설치형(① 서버) · 새 리눅스 서버용. 직접 쓰지 말고 deploy/server/install.sh 가 띄운다(값은 설치 폴더의 환경 파일).
# 허브(deploy/hub/compose.yaml)와 같은 이미지·같은 데이터 위치(hub/data) — 그래서 엔진 칸 관리(deploy/hub/ieun.sh)를 그대로 쓴다.
# 다른 점: 프록시 네트워크 없이 이 서버의 포트 하나(IEON_PORT)를 연다. https 주소(카카오·앱용)는 앞단(Caddy·Nginx·Cloudflare 등)에서 이 포트로.
name: ieon-server
services:
  hub:
    build: { context: ../.., dockerfile: deploy/hub/Dockerfile }
    image: ieun-hub:0.0.1
    container_name: ${IEON_CONTAINER:-ieun-relay}
    restart: unless-stopped
    user: "1001:1001"
    environment:
      IEON_SHARED_CLAUDE_DIR: /data/shared-auth/claude   # 서버 Claude 로그인(화면에서 한 번, 모든 칸이 같이 씀)
      IEON_INSTALL_KIND: ${IEON_INSTALL_KIND:-server}     # 처음 설치 때만 씀: server(① 서버 설치형) | hub(② 허브형) — 나중엔 화면에서 바꿈
      IEON_WEB_ALLOW: ${IEON_WEB_ALLOW:-}                 # 처음 설치 때만 씀: 웹 화면을 열 수 있는 주소(쉼표로 여럿) — 나중엔 화면(허브 보안)에서 바꿈
      IEON_TRUSTED_PROXIES: ${IEON_TRUSTED_PROXIES:-}     # 앞단 프록시가 있으면 그 주소(실제 접속 주소를 읽기 위해)
    volumes:
      - ../../hub/data:/data
    ports:
      - "${IEON_PORT:-28770}:28770"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${IEON_MEM:-2g}
    pids_limit: ${IEON_PIDS:-512}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:28760/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
